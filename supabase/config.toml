[functions.search-airports]
verify_jwt = false

# BF-0R-3: admin-only AI content generation. Unlike the public/anonymous
# functions below, there is no crawler or anonymous shopper that legitimately
# calls this endpoint, so there is no architectural reason to keep the
# platform-level JWT gate off. verify_jwt=true rejects an unauthenticated
# request before the function even runs; the function ALSO performs its own
# explicit admin-role check (see supabase/functions/_shared/admin-auth.ts) so
# a valid-but-non-admin JWT is still rejected with 403. Defense in depth, not
# either/or.
[functions.generate-seo-content]
verify_jwt = true

[functions.publish-scheduled-pages]
verify_jwt = false

[functions.create-checkout-session]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.get-subscription-status]
verify_jwt = false

# BF-0R-4: run-optimizer is a customer feature (not admin-only), but it is no
# longer anonymous-callable. The prior verify_jwt=false + optional Authorization
# header let an anonymous caller fall through with userId=null, which is always
# under FREE_LIMIT, so the request (and a real Travelpayouts provider call)
# proceeded with no durable quota ever incremented for that caller — an
# unlimited anonymous quota bypass. verify_jwt=true rejects an unauthenticated
# request before the function runs; the function ALSO independently resolves
# and requires the caller's identity (see auth-quota-core.ts) as defense in
# depth, the same convention as the BF-0R-3 admin-only functions below.
[functions.run-optimizer]
verify_jwt = true

[functions.track-affiliate-click]
verify_jwt = false

[functions.get-special-offers]
verify_jwt = false

[functions.get-price-calendar]
verify_jwt = false

[functions.get-popular-directions]
verify_jwt = false

# BF-0R-3: admin-only bulk AI route-page generation, capable of service-role
# database mutation. Same reasoning as generate-seo-content above — no
# anonymous caller has a legitimate reason to invoke this, so the platform
# JWT gate stays on AND the function performs its own explicit admin-role
# check (supabase/functions/_shared/admin-auth.ts) that fails closed on a
# missing/invalid/non-admin token.
[functions.generate-route-page]
verify_jwt = true

[functions.search-flights]
verify_jwt = false

[functions.get-redirect]
verify_jwt = false

[functions.get-ads]
verify_jwt = false

[functions.flight-destinations]
verify_jwt = false

[functions.tiqets-catalog]
verify_jwt = false
[functions.viator-catalog]
verify_jwt = false
[functions.viator-public]
verify_jwt = false
[functions.tiqets-public]
verify_jwt = false
[functions.things-activity-public]
