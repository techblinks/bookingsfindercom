  <text x="400" y="400" text-anchor="middle" font-family="system-ui,sans-serif" font-size="42" font-weight="700" fill="white">Bali</text>
  <text x="400" y="440" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="white" opacity="0.6">Indonesia</text>
</svg>
