  <rect x="280" y="220" width="6" height="70" rx="3" fill="#fff" opacity="0.12"/>
  <ellipse cx="283" cy="220" rx="30" ry="12" fill="#fff" opacity="0.06"/>
  <ellipse cx="283" cy="225" rx="22" ry="10" fill="#fff" opacity="0.05"/>
