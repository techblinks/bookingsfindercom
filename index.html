<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
     <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BookingsFinder | Compare Travel Options</title>
    <meta name="description" content="BookingsFinder is a travel planning and comparison platform. Search and compare flight options from travel partners." />
    <meta name="author" content="BookingsFinder" />
    <link rel="icon" href="/favicon.png" type="image/png" />
 
     <!-- Capacitor/Mobile App Meta Tags -->
     <meta name="theme-color" content="#003680" />
     <meta name="apple-mobile-web-app-capable" content="yes" />
     <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
     <meta name="mobile-web-app-capable" content="yes" />

    <meta property="og:title" content="BookingsFinder | Compare Travel Options" />
    <meta property="og:description" content="Search and compare travel options from partner providers. Plan your trip, estimate costs, and keep every booking organised." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://bookingsfinder.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@BookingsFinder" />
    <meta name="twitter:image" content="https://bookingsfinder.com/og-image.png" />
    
    <!--
      SEO: robots default only.

      No site-wide canonical tag is declared here, deliberately. react-helmet
      only replaces tags it owns (data-rh), so a hardcoded one is never
      overwritten — it appeared alongside each page's own, and on pages without
      a Helmet canonical it was the ONLY one, pointing every URL at the
      homepage. Each page declares its own instead.
    -->
    <meta name="robots" content="index, follow" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
