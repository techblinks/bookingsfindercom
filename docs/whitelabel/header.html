<!--
  BookingsFinder White Label — Header
  Paste into: Travelpayouts Dashboard → Custom HTML → Header field
  (Confirm exact field name in the dashboard before pasting.)

  Minimal header: BookingsFinder logo + "Back to BookingsFinder" link.
  Full navigation excluded — misleading nav is worse than simplicity.

  No JavaScript. No inline event handlers. No third-party resources.
-->

<style>
  .bf-wl-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    padding: 0 16px;
    background: #FFFFFF;
    border-bottom: 1px solid #C4BFB6;
    font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    box-sizing: border-box;
    width: 100%;
  }

  .bf-wl-header a {
    color: inherit;
    text-decoration: none;
  }

  .bf-wl-header a:focus-visible {
    outline: 2px solid #0D4F5C;
    outline-offset: 2px;
  }

  .bf-wl-header-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #2A2827;
  }

  .bf-wl-header-logo img {
    height: 40px;
    width: auto;
  }

  .bf-wl-header-back {
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    color: #FFFFFF;
    background: #0D4F5C;
    white-space: nowrap;
  }

  .bf-wl-header-back:hover {
    background: #0A3D47;
  }
</style>

<header class="bf-wl-header">
  <a href="https://bookingsfinder.com" class="bf-wl-header-logo" title="BookingsFinder — Compare flights and plan trips">
    <img
      src="https://bookingsfinder.com/logo.webp"
      alt="BookingsFinder"
      width="40"
      height="40"
    />
  </a>

  <a href="https://bookingsfinder.com" class="bf-wl-header-back">Back to BookingsFinder</a>
</header>
